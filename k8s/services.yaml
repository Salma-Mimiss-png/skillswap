apiVersion: v1 
kind: Service 
metadata: 
  name: mongodb-service 
spec: 
  selector: 
    app: mongodb 
  ports: 
  - port: 27017 
    targetPort: 27017 
--- 
apiVersion: v1 
kind: Service 
metadata: 
  name: backend-service 
spec: 
  selector: 
    app: backend 
  type: NodePort 
  ports: 
  - port: 8080 
    targetPort: 8080 
    nodePort: 30080 
--- 
apiVersion: v1 
kind: Service 
metadata: 
  name: frontend-service 
spec: 
  selector: 
    app: frontend 
  type: NodePort 
  ports: 
  - port: 80 
    targetPort: 80 
    nodePort: 30000
